services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports: ["8000:8000"]
    volumes: ["tremor-data:/app/data/runtime"]
    env_file: .env
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_PROXY: http://api:8000
    ports: ["5173:5173"]
    depends_on:
      api:
        condition: service_healthy
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: [jobs]
    command: [python, -m, backend.app.scheduler]
    volumes: ["tremor-data:/app/data/runtime"]
    env_file: .env
volumes:
  tremor-data:

